<svg width="900" height="220" viewBox="0 0 900 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated banner with waves and the text Tiago Trindade">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="45%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <rect width="900" height="220" rx="28" fill="url(#bg)"/>
  <g opacity="0.65">
    <circle cx="120" cy="60" r="6" fill="#e0f2fe">
      <animate attributeName="r" values="4;7;4" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="780" cy="170" r="5" fill="#fdf4ff">
      <animate attributeName="r" values="3;6;3" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="620" cy="40" r="4" fill="#cffafe">
      <animate attributeName="r" values="2;5;2" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
  <path d="M-20 140 C 120 60, 260 200, 420 120 S 680 140, 920 80" stroke="url(#wave)" stroke-width="4" stroke-linecap="round" stroke-dasharray="12 10">
    <animate attributeName="stroke-dashoffset" values="0;-120" dur="7s" repeatCount="indefinite"/>
  </path>
  <path d="M-30 170 C 140 90, 280 220, 460 150 S 700 170, 930 110" stroke="url(#wave)" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 12" opacity="0.7">
    <animate attributeName="stroke-dashoffset" values="0;-160" dur="9s" repeatCount="indefinite"/>
  </path>
  <path d="M-10 110 C 160 40, 280 150, 460 100 S 720 120, 910 50" stroke="url(#wave)" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 14" opacity="0.8">
    <animate attributeName="stroke-dashoffset" values="0;-140" dur="8s" repeatCount="indefinite"/>
  </path>
  <g opacity="0.85">
    <text x="60" y="130" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="600" letter-spacing="6">
      TIAGO TRINDADE
    </text>
    <text x="60" y="160" fill="#bae6fd" font-family="'Segoe UI', sans-serif" font-size="14" letter-spacing="4">
      CODE · CREATE · EXPLORE
    </text>
  </g>
</svg>
